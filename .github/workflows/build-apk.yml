name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成签名密钥
        run: |
          keytool -genkey -v \
            -keystore app/cryptopulse.keystore \
            -alias cryptopulse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass crypto123 -keypass crypto123 \
            -dname "CN=CryptoPulse,O=CryptoPulse,C=CN" \
            -noprompt

      - name: 创建签名配置文件
        run: |
          cat > app/keystore.properties << 'EOF'
          storeFile=cryptopulse.keystore
          storePassword=crypto123
          keyAlias=cryptopulse
          keyPassword=crypto123
          EOF

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-pulse-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
